<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalentTrack ATS (Java Swing)</title>
<style>
  html, body { margin: 0; height: 100%; background: #f1f5f9; font-family: Arial, sans-serif; }
  #bar { background: #0f172a; color: #fff; padding: 8px 16px; font-size: 14px; }
  #app { width: 100vw; height: calc(100vh - 36px); }
</style>
<script src="https://cjrtnc.leaningtech.com/3.1/cj3loader.js"></script>
</head>
<body>
  <div id="bar">TalentTrack ATS: Java Swing app running in your browser via CheerpJ (first load may take a few seconds)</div>
  <div id="app"></div>
  <script type="module">
    await cheerpjInit();
    cheerpjCreateDisplay(-1, -1, document.getElementById("app"));
    await cheerpjRunJar("/app/ATS.jar");
  </script>
</body>
</html>
